version: '3.8'
services:
  openshift-java-demo:
    build:
      context: .
      dockerfile: Dockerfile
    image: openshift-java-demo:latest
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${DB_HOST:-tododb}:5432/todo
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-todo}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASS:-demo123}
    volumes:
      - ./config:/app/config
