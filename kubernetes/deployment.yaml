apiVersion: apps/v1
kind: Deployment
metadata:
  name: openshift-java-demo
  namespace: openshift-java-demo
  labels:
    app: openshift-java-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: openshift-java-demo
  template:
    metadata:
      labels:
        app: openshift-java-demo
    spec:
      containers:
      - name: openshift-java-demo
        image: {{IMAGE_URI}}
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "docker"
        - name: SPRING_DATASOURCE_URL
          value: {{SPRING_DATASOURCE_URL}}
        - name: SPRING_DATASOURCE_USERNAME
          value: {{SPRING_DATASOURCE_USERNAME}}
        - name: SPRING_DATASOURCE_PASSWORD
          value: {{SPRING_DATASOURCE_PASSWORD}}
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
